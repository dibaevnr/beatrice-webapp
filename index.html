<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beatrice • Панель</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">👑 Beatrice</div>
      <div class="user-info" id="user-info">Загрузка...</div>
    </div>

    <h1 class="title">Добро пожаловать</h1>

    <!-- Menu Cards -->
    <div class="menu-grid">
      <div class="card" onclick="navigate('profile')">
        <div class="card-icon">👤</div>
        <div class="card-title">Мой аккаунт</div>
        <div class="card-subtitle">Профиль и информация</div>
      </div>

      <div class="card" onclick="navigate('subscriptions')">
        <div class="card-icon">📊</div>
        <div class="card-title">Мои подписки</div>
        <div class="card-subtitle">Активные услуги</div>
      </div>

      <div class="card" onclick="navigate('status')">
        <div class="card-icon">📡</div>
        <div class="card-title">Состояние</div>
        <div class="card-subtitle">Подключение и статус</div>
      </div>

      <div class="card" onclick="navigate('support')">
        <div class="card-icon">💬</div>
        <div class="card-title">Поддержка</div>
        <div class="card-subtitle">Написать администратору</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
