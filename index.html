<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beatrice • Панель</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">👑 Beatrice</div>
      <div class="user-info" id="user-info">Загрузка...</div>
    </div>

    <h1 class="title">Личный кабинет</h1>

    <!-- Мой аккаунт -->
    <div class="profile-card" id="profile-card">
      <img id="user-photo" class="user-photo" src="" alt="Фото">
      <h2 id="user-name">Загрузка...</h2>
      <p id="user-username">@username</p>
      <p id="user-id">ID: —</p>
    </div>

    <div class="menu-grid">
      <div class="card" onclick="navigate('profile')">
        <div class="card-icon">👤</div>
        <div class="card-title">Мой аккаунт</div>
      </div>

      <div class="card" onclick="navigate('subscriptions')">
        <div class="card-icon">📊</div>
        <div class="card-title">Мои подписки</div>
      </div>

      <div class="card" onclick="navigate('status')">
        <div class="card-icon">📡</div>
        <div class="card-title">Состояние соединения</div>
      </div>

      <div class="card" onclick="navigate('support')">
        <div class="card-icon">💬</div>
        <div class="card-title">Поддержка</div>
      </div>

      <div class="card admin-only" onclick="navigate('users')" id="users-card" style="display:none;">
        <div class="card-icon">👥</div>
        <div class="card-title">Пользователи</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
