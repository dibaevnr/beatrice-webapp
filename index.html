<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beatrice • 3X-UI</title>
  <link rel="stylesheet" href="style.css?v=11.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">👑 Beatrice</div>
      <div id="user-info">Загрузка...</div>
    </div>

    <h1 class="title">Панель 3X-UI</h1>

    <!-- Профиль -->
    <div class="profile-card">
      <img id="user-photo" class="user-photo" src="" alt="Фото">
      <h2 id="user-name">Загрузка...</h2>
      <p id="user-username">@username</p>
      <p id="user-id">ID: —</p>
    </div>

    <!-- Статистика -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="total-users">0</div>
        <div class="stat-label">Всего пользователей</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="online-users">0</div>
        <div class="stat-label">Онлайн</div>
      </div>
    </div>

    <div class="menu-grid">
      <div class="card" data-section="profile">
        <div class="card-icon">👤</div>
        <div class="card-title">Моя страница</div>
      </div>
      
      <div class="card" data-section="users">
        <div class="card-icon">👥</div>
        <div class="card-title">Пользователи</div>
      </div>
      
      <div class="card" data-section="status">
        <div class="card-icon">📡</div>
        <div class="card-title">Статус сервера</div>
      </div>
      
      <div class="card" data-section="support">
        <div class="card-icon">💬</div>
        <div class="card-title">Поддержка</div>
      </div>
    </div>

    <!-- Секция Пользователи (продвинутая) -->
    <div id="users-section" class="section">
      <div class="section-header">
        <h2>👥 Действующие пользователи</h2>
        <button class="refresh-btn" onclick="loadUsers()">🔄 Обновить</button>
      </div>
      <div id="users-list" class="users-list">
        <!-- Заполняется через JS -->
      </div>
    </div>

  </div>

  <script src="app.js?v=11.0"></script>
</body>
</html>
