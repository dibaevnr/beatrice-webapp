<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beatrice • Панель</title>
  <link rel="stylesheet" href="style.css?v=6.1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">👑 Beatrice</div>
      <div class="user-info" id="user-info">Загрузка...</div>
    </div>
    
    <h1 class="title">Личный кабинет</h1>

    <!-- Профиль -->
    <div class="profile-card">
      <img id="user-photo" class="user-photo" src="" alt="Фото">
      <h2 id="user-name">Загрузка...</h2>
      <p id="user-username">@username</p>
      <p id="user-id">ID: —</p>
    </div>

    <div class="menu-grid">
      <div class="card" data-section="profile">
        <div class="card-icon">👤</div>
        <div class="card-title">Моя страница</div>
      </div>
      
      <div class="card" data-section="subscriptions">
        <div class="card-icon">📊</div>
        <div class="card-title">Мои подписки</div>
      </div>
      
      <div class="card" data-section="status">
        <div class="card-icon">📡</div>
        <div class="card-title">Состояние соединения</div>
      </div>
      
      <div class="card" data-section="support">
        <div class="card-icon">💬</div>
        <div class="card-title">Написать Беатриске</div>
      </div>
    </div>
  </div>

  <script src="app.js?v=6.1"></script>
</body>
</html>
